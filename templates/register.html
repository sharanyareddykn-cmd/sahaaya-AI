{% extends "base.html" %}

{% block title %}
Citizen Registration
{% endblock %}


{% block content %}


<div class="card"
     style="max-width:650px;margin:60px auto;">

    <h1>
        Create Citizen Account
    </h1>

    <p>
        Your unique Citizen ID will be generated automatically.
    </p>


    <form method="POST"
          class="form">


        <label>
            Citizen Name

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </label>


        <label>
            Email

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

        </label>


        <label>
            Phone

            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
            >

        </label>


        <label>
            Ward / Area

            <input
                type="text"
                name="ward"
                placeholder="Enter your ward or area"
            >

        </label>


        <label>
            Password

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

        </label>


        <button
            class="btn"
            type="submit">

            Create Account

        </button>


    </form>

</div>


{% endblock %}
